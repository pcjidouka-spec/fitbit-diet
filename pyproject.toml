[project]
name = "fitbit-diet"
version = "0.1.0"
description = "Personal diet tracking CLI integrating Fitbit, Renpho, and HPasaneel publish"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "click>=8.1",
  "python-dotenv>=1.0",
  "jsonschema>=4.21",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
diet = "diet.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
